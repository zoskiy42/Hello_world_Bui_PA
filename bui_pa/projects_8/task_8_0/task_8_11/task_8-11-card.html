<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карточка товара — эксперимент с CSS</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f0f2f5;
            margin: 40px;
            line-height: 1.5;
            padding: 20px;
        }

        .card {
            max-width: 320px;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px 24px 24px 24px;
            border: 1px solid #ddd;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: 0.2s ease;
        }

        .card.product {
            background: linear-gradient(145deg, #ffffff 0%, #fef9e6 100%);
        }

        h1, h2, h3 {
            color: #1e2a3e;
            margin-top: 0;
            font-weight: 600;
        }

        .description {
            color: #4a5568;
            margin: 12px 0;
        }

        .price {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c7a4d;
            margin: 16px 0 12px;
        }

        .btn.btn-primary {
            display: inline-block;
            background-color: #2c7a4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            width: 100%;
            font-weight: bold;
        }

        .btn.btn-primary:hover {
            background-color: #1f5a38;
        }

    </style>
</head>
<body>

    <div class="card product">
        <h2>Смарт-часы Active Pro</h2>
        <p class="description">Отслеживание пульса, шагомер, водонепроницаемый корпус, время работы до 7 дней.</p>
        <p class="price">1500 ₽</p>
        <button class="btn btn-primary">Купить</button>
    </div>

</body>
</html>
